<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Tech Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9F3E7"/><stop offset=".5" stop-color="#E8E4FF"/><stop offset="1" stop-color="#FFE6DE"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="150" rx="28"/></clipPath>
    <path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
  </defs>
  <style>
    .blob{animation:drift 13s ease-in-out infinite alternate}
    .b2{animation-duration:17s;animation-direction:alternate-reverse}
    .tw{animation:tw 3.2s ease-in-out infinite}
    .t2{animation-delay:-1s}.t3{animation-delay:-2s}
    @keyframes drift{to{transform:translate(36px,-14px) scale(1.12)}}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <circle class="blob" cx="110" cy="140" r="95" fill="#CFC8FF" opacity=".5"/>
    <circle class="blob b2" cx="1090" cy="20" r="105" fill="#A9E3CD" opacity=".42"/>
    <use class="tw" href="#s" x="290" y="50" fill="#FFB4A2"/>
    <use class="tw t2" href="#s" x="190" y="104" fill="#B3A9FA"/>
    <use class="tw t3" href="#s" x="910" y="50" fill="#F5B8C8"/>
    <use class="tw" href="#s" x="1010" y="104" fill="#A9E3CD"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="600" y="72" font-size="46" font-weight="800" fill="url(#t)">Tech Stack</text>
      <text x="600" y="112" font-size="23" fill="#7A6B88">The tools behind my projects</text>
    </g>
  </g>
</svg>
