<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Let's talk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9F3E7"/><stop offset=".5" stop-color="#E8E4FF"/><stop offset="1" stop-color="#FFE6DE"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="170" rx="28"/></clipPath>
    <path id="pin" d="M0 0C-4-7-17-15-17-28a17 17 0 0 1 34 0C17-15 4-7 0 0Z"/>
  </defs>
  <style>
    .blob{animation:drift 12s ease-in-out infinite alternate}
    .b2{animation-duration:16s;animation-direction:alternate-reverse}
    .pin{animation:bob 3.4s ease-in-out infinite}
    .p2{animation-delay:-1.7s}
    @keyframes drift{to{transform:translate(40px,-16px) scale(1.12)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="170" fill="url(#bg)"/>
    <circle class="blob" cx="140" cy="170" r="110" fill="#A9E3CD" opacity=".45"/>
    <circle class="blob b2" cx="1060" cy="10" r="120" fill="#FFB4A2" opacity=".32"/>
    <g transform="translate(230 112)"><g class="pin"><use href="#pin" fill="#B3A9FA"/><circle cy="-28" r="7" fill="#fff"/></g></g>
    <g transform="translate(970 112)"><g class="pin p2"><use href="#pin" fill="#FFB4A2"/><circle cy="-28" r="7" fill="#fff"/></g></g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="600" y="84" font-size="52" font-weight="800" fill="url(#t)">Let's talk</text>
      <text x="600" y="126" font-size="24" fill="#7A6B88">Open to student developer positions</text>
    </g>
  </g>
</svg>
