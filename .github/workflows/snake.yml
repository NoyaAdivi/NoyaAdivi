   name: Generate snake animation

   on:
     schedule:
       - cron: "0 0 * * *"
     workflow_dispatch:
     push:
       branches:
         - main

   permissions:
     contents: write

   jobs:
     generate:
       runs-on: ubuntu-latest
       timeout-minutes: 5
       steps:
         - name: Generate snake SVGs
           uses: Platane/snk/svg-only@v3
           with:
             github_user_name: ${{ github.repository_owner }}
             outputs: |
               dist/github-snake.svg?color_snake=#f5a3b8&color_dots=#ebedf0,#dbefff,#a9d6f5,#7fb8e3,#5b8fc7
               dist/github-snake-dark.svg?palette=github-dark&color_snake=#f5a3b8

         - name: Push to the output branch
           uses: crazy-max/ghaction-github-pages@v4
           with:
             target_branch: output
             build_dir: dist
           env:
             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
