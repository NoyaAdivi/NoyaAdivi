<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Noya Adivi, Computer Science Student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE6DE"/>
      <stop offset=".55" stop-color="#E8E4FF"/>
      <stop offset="1" stop-color="#D9F3E7"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E36E57"/>
      <stop offset="1" stop-color="#6F60F0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="32"/></clipPath>
    <path id="pin" d="M0 0C-5-9-22-20-22-37a22 22 0 0 1 44 0C22-20 5-9 0 0Z"/>
  </defs>
  <style>
    .blob{animation:drift 11s ease-in-out infinite alternate}
    .b2{animation-duration:14s;animation-direction:alternate-reverse}
    .b3{animation-duration:17s}
    .pin{animation:bob 3.4s ease-in-out infinite}
    .p2{animation-delay:-.9s}.p3{animation-delay:-1.8s}.p4{animation-delay:-2.6s}
    .route{stroke-dasharray:3 15;animation:walk 3s linear infinite}
    .rise{animation:rise .9s ease-out both}
    .r2{animation-delay:.2s}
    @keyframes drift{to{transform:translate(48px,-26px) scale(1.14)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes walk{to{stroke-dashoffset:-54}}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="blob" cx="150" cy="300" r="130" fill="#FFB4A2" opacity=".32"/>
    <circle class="blob b2" cx="760" cy="30" r="150" fill="#CFC8FF" opacity=".5"/>
    <circle class="blob b3" cx="1120" cy="270" r="140" fill="#A9E3CD" opacity=".45"/>
    <path class="route" d="M770 232C850 150 905 262 975 182S1075 96 1120 138" fill="none" stroke="#6F60F0" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(770 232)"><g class="pin"><use href="#pin" fill="#FFB4A2"/><circle cy="-37" r="9" fill="#fff"/></g></g>
    <g transform="translate(888 196)"><g class="pin p2"><use href="#pin" fill="#A9E3CD"/><circle cy="-37" r="9" fill="#fff"/></g></g>
    <g transform="translate(975 182)"><g class="pin p3"><use href="#pin" fill="#B3A9FA"/><circle cy="-37" r="9" fill="#fff"/></g></g>
    <g transform="translate(1120 138)"><g class="pin p4"><use href="#pin" fill="#F5B8C8"/><circle cy="-37" r="9" fill="#fff"/></g></g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
      <text class="rise" x="72" y="160" font-size="88" font-weight="800" fill="url(#name)">Noya Adivi</text>
      <text class="rise r2" x="76" y="214" font-size="29" font-weight="600" fill="#2B2140">Computer Science Student</text>
      <text class="rise r2" x="76" y="254" font-size="24" fill="#7A6B88">Full-Stack Development · Machine Learning</text>
    </g>
  </g>
</svg>
